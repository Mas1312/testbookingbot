<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Кабинет TeleSlot</title>
<script src="/telegram-web-app.js?v=1"></script>
<style>
  :root {
    --bg: #0B0F1A;
    --surface: #131826;
    --surface-2: #1B2233;
    --border: rgba(255, 255, 255, 0.08);
    --text: #F4F6FB;
    --hint: #9AA4BD;
    --primary: #5B6CFF;
    --primary-text: #FFFFFF;
    --ok: #3DD68C;
    --warn: #F5B642;
    --bad: #FF6B6B;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 9px; background: var(--primary); color: var(--primary-text);
    display: flex; align-items: center; justify-content: center; font-weight: 800;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--hint); margin: 26px 0 10px; font-weight: 700; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .biz-name { font-size: 17px; font-weight: 700; margin: 0 0 2px; word-break: break-word; }
  .biz-bot { font-size: 13px; color: var(--hint); margin: 0 0 12px; }
  .biz-bot a { color: var(--hint); }
  .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); margin-bottom: 12px; }
  .badge.ok { color: var(--ok); }
  .badge.warn { color: var(--warn); }
  .badge.bad { color: var(--bad); }
  .meta { font-size: 13px; color: var(--hint); margin: 0 0 12px; }

  .btn {
    display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
    cursor: pointer; text-align: center; text-decoration: none; background: var(--primary); color: var(--primary-text);
  }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); margin-top: 8px; }
  .btn.urgent { background: var(--warn); color: #1a1405; margin-top: 8px; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn + .btn { margin-top: 8px; }

  .stats { display: flex; gap: 10px; margin-bottom: 12px; }
  .stat { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .stat-num { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; }
  .stat-label { display: block; font-size: 12px; color: var(--hint); margin-top: 2px; }
  .stat.attention { border-color: var(--warn); }
  .stat.attention .stat-num { color: var(--warn); }

  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row .l { min-width: 0; word-break: break-word; }
  .row .r { text-align: right; color: var(--hint); white-space: nowrap; }
  .hint { color: var(--hint); font-size: 14px; margin: 0; }
  .doc { display: block; padding: 13px 0; border-bottom: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 15px; }
  .doc:last-child { border-bottom: none; }
  .empty { text-align: center; padding: 28px 8px; }
  .empty p { margin: 0 0 14px; color: var(--hint); }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 90%;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    padding: 11px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-mark">T</div>
    <h1>Кабинет TeleSlot</h1>
  </header>

  <div id="loading" class="hint">Загрузка…</div>

  <div id="not-telegram" class="card hidden">
    <p class="biz-name">Откройте из Telegram</p>
    <p class="hint" style="margin-bottom:14px">Кабинет работает внутри бота: нажмите кнопку «Кабинет» в чате с @teleslotapp_bot.</p>
    <a class="btn" href="https://t.me/teleslotapp_bot" target="_blank" rel="noopener">Открыть бота</a>
  </div>

  <div id="error" class="card hidden"><p class="hint" id="error-text"></p></div>

  <main id="content" class="hidden">
    <h2>Мои бизнесы</h2>
    <div id="businesses"></div>

    <div id="history-block" class="hidden">
      <h2>История оплат</h2>
      <div class="card" id="history"></div>
    </div>

    <h2>Документы и поддержка</h2>
    <div class="card" id="docs"></div>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="/cabinet.js?v=1"></script>
</body>
</html>
